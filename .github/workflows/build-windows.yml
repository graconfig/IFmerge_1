name: Build Windows EXE

# 触发方式:
#   1) 推送形如 v1.0.0 的 tag  -> 打包并自动创建 GitHub Release(附 zip)
#   2) 在 Actions 页面手动点 Run -> 仅产出可下载的构建产物(artifact)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write          # 允许创建 Release 并上传资产

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ifanalyzer.spec

      - name: Zip onedir output
        shell: pwsh
        run: Compress-Archive -Path dist/IFAnalyzer -DestinationPath IFAnalyzer-windows-x64.zip

      # 每次运行都留一份产物(手动触发时也能下载)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFAnalyzer-windows-x64
          path: IFAnalyzer-windows-x64.zip

      # 仅当由 tag 触发时,自动挂到对应 Release 下
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: IFAnalyzer-windows-x64.zip
